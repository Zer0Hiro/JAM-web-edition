<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e2b04a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2b04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="120" fill="url(#glow)"/>
  <!-- Bell body -->
  <path d="M160,140 Q160,100 200,90 Q240,100 240,140 L250,200 Q250,220 200,225 Q150,220 150,200 Z" fill="none" stroke="#e2b04a" stroke-width="3" opacity="0.9"/>
  <ellipse cx="200" cy="218" rx="52" ry="10" fill="none" stroke="#e2b04a" stroke-width="2.5" opacity="0.7"/>
  <line x1="200" y1="225" x2="200" y2="245" stroke="#e2b04a" stroke-width="2.5" opacity="0.7"/>
  <circle cx="200" cy="248" r="5" fill="#e2b04a" opacity="0.7"/>
  <!-- Sound waves -->
  <path d="M260,150 Q280,160 260,180" fill="none" stroke="#e2b04a" stroke-width="1.5" opacity="0.4"/>
  <path d="M275,140 Q300,160 275,190" fill="none" stroke="#e2b04a" stroke-width="1.5" opacity="0.25"/>
  <path d="M140,150 Q120,160 140,180" fill="none" stroke="#e2b04a" stroke-width="1.5" opacity="0.4"/>
  <path d="M125,140 Q100,160 125,190" fill="none" stroke="#e2b04a" stroke-width="1.5" opacity="0.25"/>
  <!-- 3/4 time signature -->
  <text x="200" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#e2b04a" opacity="0.6">3/4</text>
  <!-- Title -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8892a8" letter-spacing="3">BELL WALTZ</text>
</svg>
